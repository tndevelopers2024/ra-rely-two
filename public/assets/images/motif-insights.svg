<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Practical finance knowledge: articles, analysis and clear takeaways">
  <g stroke="#0B1B4D" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="230" x2="1200" y2="230" />
    <line x1="0" y1="470" x2="1200" y2="470" />
    <line x1="0" y1="710" x2="1200" y2="710" />
  </g>

  <!-- Article page -->
  <g transform="translate(250,220)">
    <rect x="0" y="0" width="440" height="470" rx="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#0B1B4D" stroke-opacity="0.16" stroke-width="2.5" />
    <rect x="40" y="44" width="200" height="20" rx="10" fill="#0B1B4D" fill-opacity="0.22" />
    <g stroke="#0B1B4D" stroke-opacity="0.12" stroke-width="3" stroke-linecap="round">
      <line x1="40" y1="104" x2="360" y2="104" />
      <line x1="40" y1="136" x2="380" y2="136" />
      <line x1="40" y1="168" x2="330" y2="168" />
      <line x1="40" y1="232" x2="360" y2="232" />
      <line x1="40" y1="264" x2="300" y2="264" />
    </g>
    <!-- inline mini chart -->
    <rect x="40" y="312" width="360" height="120" rx="10" fill="#C4A35A" fill-opacity="0.1" />
    <path d="M60 400 L 120 372 L 180 388 L 240 340 L 300 356 L 360 320"
      stroke="#C4A35A" stroke-opacity="0.8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Magnifier over a trend -->
  <g transform="translate(830,430)">
    <circle r="96" fill="#FFFFFF" fill-opacity="0.55" stroke="#0B1B4D" stroke-opacity="0.12" stroke-width="10" />
    <circle r="96" fill="none" stroke="#C4A35A" stroke-opacity="0.5" stroke-width="3" />
    <path d="M-54 24 L -18 -8 L 12 12 L 54 -34"
      stroke="#A6863D" stroke-opacity="0.8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="70" y1="70" x2="120" y2="120" stroke="#0B1B4D" stroke-opacity="0.2" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Lightbulb takeaway -->
  <g transform="translate(940,200)" stroke="#C4A35A" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="34" />
    <path d="M-12 40 h24 M-8 54 h16" />
    <path d="M0 -16 v14 M-12 -6 l8 6 M12 -6 l-8 6" stroke-opacity="0.4" />
  </g>
</svg>
