<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One operating model adapted across different industries">
  <g stroke="#0B1B4D" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="470" x2="1200" y2="470" />
    <line x1="0" y1="700" x2="1200" y2="700" />
  </g>

  <!-- Central hub -->
  <g transform="translate(620,470)">
    <circle r="70" fill="#0B1B4D" fill-opacity="0.9" />
    <circle r="70" fill="none" stroke="#C4A35A" stroke-opacity="0.5" stroke-width="3" />
    <path d="M-24 0 h48 M0 -24 v48" stroke="#D8BD7E" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Spokes -->
  <g stroke="#0B1B4D" stroke-opacity="0.16" stroke-width="2.5" stroke-linecap="round">
    <line x1="560" y1="420" x2="380" y2="300" />
    <line x1="680" y1="420" x2="860" y2="300" />
    <line x1="560" y1="520" x2="380" y2="640" />
    <line x1="680" y1="520" x2="860" y2="640" />
  </g>

  <!-- Sector cards, each distinct -->
  <g stroke-width="2.5" fill="none">
    <!-- professional services: briefcase -->
    <g transform="translate(300,240)">
      <rect x="0" y="0" width="150" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#0B1B4D" stroke-opacity="0.2" />
      <rect x="46" y="40" width="58" height="44" rx="6" stroke="#0B1B4D" stroke-opacity="0.3" />
      <path d="M64 40 v-10 h22 v10" stroke="#C4A35A" stroke-opacity="0.6" />
    </g>
    <!-- trades: hard hat -->
    <g transform="translate(780,240)">
      <rect x="0" y="0" width="150" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#0B1B4D" stroke-opacity="0.2" />
      <path d="M46 78 a29 29 0 0 1 58 0 z" stroke="#0B1B4D" stroke-opacity="0.3" />
      <line x1="40" y1="78" x2="110" y2="78" stroke="#C4A35A" stroke-opacity="0.6" />
    </g>
    <!-- healthcare: pulse -->
    <g transform="translate(300,580)">
      <rect x="0" y="0" width="150" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#0B1B4D" stroke-opacity="0.2" />
      <path d="M28 60 h26 l10 -22 l14 44 l10 -22 h30" stroke="#C4A35A" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <!-- retail: cart -->
    <g transform="translate(780,580)">
      <rect x="0" y="0" width="150" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#0B1B4D" stroke-opacity="0.2" />
      <path d="M40 42 h12 l10 40 h34 l10 -28 h-52" stroke="#0B1B4D" stroke-opacity="0.3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="66" cy="92" r="5" fill="#C4A35A" fill-opacity="0.6" stroke="none" />
      <circle cx="94" cy="92" r="5" fill="#C4A35A" fill-opacity="0.6" stroke="none" />
    </g>
  </g>
</svg>
