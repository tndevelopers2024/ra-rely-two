<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modular finance services composed into one connected engagement">
  <defs>
    <linearGradient id="slTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="1" stop-color="#F5F2EA" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <g stroke="#0B1B4D" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="430" x2="1200" y2="430" />
    <line x1="0" y1="650" x2="1200" y2="650" />
  </g>

  <!-- Connecting spine -->
  <path d="M250 450 H 1010" stroke="#0B1B4D" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round" />
  <path d="M250 450 H 1010" stroke="#C4A35A" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" />

  <!-- Modular tiles of varied height on the spine -->
  <g>
    <rect x="210" y="330" width="150" height="150" rx="18" fill="url(#slTile)" stroke="#0B1B4D" stroke-opacity="0.18" stroke-width="2.5" />
    <rect x="240" y="362" width="66" height="12" rx="6" fill="#0B1B4D" fill-opacity="0.18" />
    <rect x="240" y="388" width="90" height="12" rx="6" fill="#0B1B4D" fill-opacity="0.10" />
    <rect x="240" y="430" width="44" height="20" rx="6" fill="#C4A35A" fill-opacity="0.35" />

    <rect x="420" y="290" width="150" height="200" rx="18" fill="#132766" fill-opacity="0.10" stroke="#0B1B4D" stroke-opacity="0.16" stroke-width="2.5" />
    <rect x="450" y="322" width="66" height="12" rx="6" fill="#0B1B4D" fill-opacity="0.16" />
    <rect x="450" y="348" width="90" height="12" rx="6" fill="#0B1B4D" fill-opacity="0.10" />

    <rect x="630" y="270" width="160" height="260" rx="20" fill="#0B1B4D" fill-opacity="0.9" />
    <rect x="662" y="308" width="70" height="12" rx="6" fill="#D8BD7E" fill-opacity="0.85" />
    <rect x="662" y="334" width="96" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.35" />
    <rect x="662" y="356" width="80" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.22" />
    <path d="M662 470 l16 16 l30 -34" stroke="#C4A35A" stroke-opacity="0.9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="850" y="320" width="150" height="170" rx="18" fill="url(#slTile)" stroke="#0B1B4D" stroke-opacity="0.18" stroke-width="2.5" />
    <rect x="880" y="352" width="66" height="12" rx="6" fill="#0B1B4D" fill-opacity="0.18" />
    <rect x="880" y="378" width="90" height="12" rx="6" fill="#0B1B4D" fill-opacity="0.10" />
    <rect x="880" y="440" width="60" height="20" rx="6" fill="#C4A35A" fill-opacity="0.3" />
  </g>

  <!-- Connector nodes -->
  <g fill="#FFFFFF" stroke="#C4A35A" stroke-width="3">
    <circle cx="285" cy="450" r="7" />
    <circle cx="495" cy="450" r="7" />
    <circle cx="710" cy="450" r="8" />
    <circle cx="925" cy="450" r="7" />
  </g>
</svg>
