<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Process improvement: tangled workflow resolving into clean parallel rails">
  <g stroke="#0B1B4D" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="470" x2="1200" y2="470" />
    <line x1="0" y1="700" x2="1200" y2="700" />
  </g>

  <!-- Tangled state, left -->
  <path d="M170 470 C 230 330, 300 620, 360 420 C 400 300, 300 520, 380 560 C 440 590, 360 380, 420 470"
    stroke="#0B1B4D" stroke-opacity="0.18" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M180 520 C 250 470, 210 610, 300 590 C 360 575, 330 470, 400 500"
    stroke="#0B1B4D" stroke-opacity="0.12" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Resolution lens -->
  <g transform="translate(560,470)">
    <circle r="88" fill="#FFFFFF" fill-opacity="0.55" stroke="#C4A35A" stroke-opacity="0.5" stroke-width="3" />
    <circle r="88" fill="none" stroke="#0B1B4D" stroke-opacity="0.10" stroke-width="10" />
  </g>

  <!-- Clean parallel rails, right -->
  <g stroke-linecap="round" fill="none">
    <path d="M660 400 H 1040" stroke="#0B1B4D" stroke-opacity="0.20" stroke-width="3.5" />
    <path d="M660 470 H 1040" stroke="#C4A35A" stroke-opacity="0.7" stroke-width="3.5" />
    <path d="M660 540 H 1040" stroke="#0B1B4D" stroke-opacity="0.20" stroke-width="3.5" />
  </g>
  <g fill="#FFFFFF" stroke="#C4A35A" stroke-width="3">
    <circle cx="1040" cy="400" r="7" />
    <circle cx="1040" cy="470" r="8" />
    <circle cx="1040" cy="540" r="7" />
  </g>

  <!-- Bottleneck funnel, upper -->
  <g transform="translate(420,180)" stroke="#0B1B4D" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M-60 0 H 60 L 22 60 V 96 H -22 V 60 Z" />
    <circle cx="0" cy="20" r="7" fill="#C4A35A" fill-opacity="0.5" stroke="none" />
  </g>

  <!-- SOP checklist, right upper -->
  <g transform="translate(880,150)" stroke="#0B1B4D" stroke-opacity="0.14" stroke-width="2.5" fill="none">
    <rect x="0" y="0" width="180" height="130" rx="12" fill="#FFFFFF" fill-opacity="0.6" />
    <path d="M22 32 l10 10 l18 -22" stroke="#C4A35A" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="66" y1="34" x2="150" y2="34" />
    <path d="M22 74 l10 10 l18 -22" stroke="#C4A35A" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="66" y1="76" x2="150" y2="76" />
  </g>
</svg>
