<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Management reporting: stacked report pages, bridge chart, trend line and KPI chips">
  <defs>
    <linearGradient id="rpLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A6863D" stop-opacity="0.5" />
      <stop offset="1" stop-color="#D8BD7E" stop-opacity="1" />
    </linearGradient>
  </defs>

  <g stroke="#0B1B4D" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="720" x2="1200" y2="720" />
  </g>

  <!-- Stacked report pages -->
  <g transform="rotate(-6 470 460)">
    <rect x="300" y="240" width="330" height="430" rx="16" fill="#132766" fill-opacity="0.06" />
    <rect x="270" y="210" width="330" height="430" rx="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#0B1B4D" stroke-opacity="0.16" stroke-width="2.5" />
    <rect x="300" y="248" width="150" height="16" rx="8" fill="#0B1B4D" fill-opacity="0.20" />
    <rect x="300" y="284" width="240" height="10" rx="5" fill="#0B1B4D" fill-opacity="0.10" />
    <rect x="300" y="306" width="200" height="10" rx="5" fill="#0B1B4D" fill-opacity="0.10" />
    <!-- KPI chips -->
    <rect x="300" y="352" width="110" height="70" rx="12" fill="#C4A35A" fill-opacity="0.22" />
    <rect x="428" y="352" width="110" height="70" rx="12" fill="#0B1B4D" fill-opacity="0.08" />
    <!-- mini bars -->
    <rect x="300" y="470" width="26" height="120" rx="5" fill="#132766" fill-opacity="0.18" />
    <rect x="338" y="510" width="26" height="80" rx="5" fill="#132766" fill-opacity="0.14" />
    <rect x="376" y="450" width="26" height="140" rx="5" fill="#C4A35A" fill-opacity="0.4" />
    <rect x="414" y="494" width="26" height="96" rx="5" fill="#132766" fill-opacity="0.16" />
    <rect x="452" y="430" width="26" height="160" rx="5" fill="#132766" fill-opacity="0.2" />
  </g>

  <!-- Bridge / waterfall chart, right -->
  <g>
    <rect x="720" y="300" width="60" height="220" rx="6" fill="#132766" fill-opacity="0.2" />
    <rect x="800" y="300" width="60" height="70" rx="6" fill="#C4A35A" fill-opacity="0.35" />
    <rect x="880" y="360" width="60" height="60" rx="6" fill="#0B1B4D" fill-opacity="0.14" />
    <rect x="960" y="360" width="60" height="90" rx="6" fill="#C4A35A" fill-opacity="0.3" />
    <rect x="1040" y="260" width="60" height="260" rx="6" fill="#132766" fill-opacity="0.24" />
    <g stroke="#0B1B4D" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="4 6">
      <line x1="780" y1="300" x2="800" y2="300" />
      <line x1="860" y1="370" x2="880" y2="370" />
      <line x1="940" y1="360" x2="960" y2="360" />
      <line x1="1020" y1="360" x2="1040" y2="360" />
    </g>
  </g>

  <!-- Trend line over the top -->
  <path d="M700 250 L 780 224 L 860 262 L 940 210 L 1020 236 L 1100 176"
    stroke="url(#rpLine)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <g fill="#FFFFFF" stroke="#C4A35A" stroke-width="3">
    <circle cx="860" cy="262" r="5" />
    <circle cx="1020" cy="236" r="5" />
    <circle cx="1100" cy="176" r="6" />
  </g>
</svg>
