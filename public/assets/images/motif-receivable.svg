<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Accounts receivable: invoice issued, structured follow-up timeline and cash collected">
  <defs>
    <linearGradient id="rcArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4A35A" stop-opacity="0.28" />
      <stop offset="1" stop-color="#C4A35A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g stroke="#0B1B4D" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="230" x2="1200" y2="230" />
    <line x1="0" y1="470" x2="1200" y2="470" />
    <line x1="0" y1="710" x2="1200" y2="710" />
  </g>

  <!-- Follow-up timeline -->
  <path d="M200 330 H 1020" stroke="#0B1B4D" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round" />
  <g fill="#FFFFFF" stroke="#C4A35A" stroke-width="3">
    <circle cx="260" cy="330" r="9" />
    <circle cx="470" cy="330" r="7" />
    <circle cx="680" cy="330" r="7" />
    <circle cx="890" cy="330" r="7" />
  </g>
  <g fill="#0B1B4D" fill-opacity="0.18" font-family="monospace" font-size="22">
    <text x="238" y="300">issue</text>
    <text x="446" y="300">day 7</text>
    <text x="654" y="300">day 14</text>
    <text x="858" y="300">day 30</text>
  </g>

  <!-- Debtor ageing buckets, shrinking -->
  <g>
    <rect x="200" y="520" width="70" height="180" rx="9" fill="#132766" fill-opacity="0.22" />
    <rect x="292" y="560" width="70" height="140" rx="9" fill="#132766" fill-opacity="0.16" />
    <rect x="384" y="600" width="70" height="100" rx="9" fill="#132766" fill-opacity="0.11" />
    <rect x="476" y="640" width="70" height="60" rx="9" fill="#132766" fill-opacity="0.07" />
  </g>

  <!-- Collection curve -->
  <path d="M180 660 C 360 660, 430 520, 620 480 C 820 438, 960 340, 1150 250 L 1150 700 L 180 700 Z" fill="url(#rcArea)" />
  <path d="M180 660 C 360 660, 430 520, 620 480 C 820 438, 960 340, 1150 250"
    stroke="#C4A35A" stroke-opacity="0.85" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Cash-in coins -->
  <g>
    <g transform="translate(880,470)">
      <circle r="46" fill="#C4A35A" fill-opacity="0.16" stroke="#C4A35A" stroke-opacity="0.55" stroke-width="3" />
      <path d="M0 -13 v26 M-9 -6 h18 M-9 6 h18" stroke="#A6863D" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" />
    </g>
    <g transform="translate(1010,410)">
      <circle r="34" fill="#C4A35A" fill-opacity="0.13" stroke="#C4A35A" stroke-opacity="0.45" stroke-width="3" />
    </g>
  </g>

  <!-- DSO ring -->
  <g transform="translate(1000,210)">
    <circle r="76" fill="none" stroke="#0B1B4D" stroke-opacity="0.10" stroke-width="16" />
    <circle r="76" fill="none" stroke="#C4A35A" stroke-opacity="0.6" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="300 478" transform="rotate(-90)" />
  </g>
</svg>
