<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Considered finance advisory: balanced structure and a clear direction">
  <g stroke="#0B1B4D" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="470" x2="1200" y2="470" />
    <line x1="0" y1="700" x2="1200" y2="700" />
  </g>

  <!-- Balanced beam -->
  <g stroke="#0B1B4D" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round">
    <line x1="600" y1="300" x2="600" y2="360" />
    <line x1="430" y1="360" x2="770" y2="360" />
    <line x1="430" y1="360" x2="430" y2="420" />
    <line x1="770" y1="360" x2="770" y2="420" />
  </g>
  <g fill="none" stroke-width="3">
    <path d="M378 420 a52 52 0 0 0 104 0 z" fill="#132766" fill-opacity="0.10" stroke="#0B1B4D" stroke-opacity="0.16" />
    <path d="M718 420 a52 52 0 0 0 104 0 z" fill="#C4A35A" fill-opacity="0.16" stroke="#C4A35A" stroke-opacity="0.45" />
  </g>
  <circle cx="600" cy="292" r="12" fill="#C4A35A" fill-opacity="0.5" />

  <!-- Ledger rules panel, left -->
  <g transform="translate(160,300)" stroke="#0B1B4D" stroke-opacity="0.12" stroke-width="2.5" fill="none">
    <rect x="0" y="0" width="180" height="240" rx="12" fill="#FFFFFF" fill-opacity="0.6" />
    <line x1="26" y1="44" x2="154" y2="44" />
    <line x1="26" y1="84" x2="154" y2="84" />
    <line x1="26" y1="124" x2="120" y2="124" />
    <line x1="26" y1="164" x2="154" y2="164" />
    <line x1="26" y1="204" x2="96" y2="204" />
  </g>

  <!-- Direction arc, right -->
  <g transform="translate(1000,470)" fill="none">
    <path d="M-90 60 A 108 108 0 0 1 78 -60" stroke="#0B1B4D" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round" />
    <path d="M-90 60 A 108 108 0 0 1 78 -60" stroke="#C4A35A" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" />
    <path d="M78 -60 l-6 24 m6 -24 l-24 4" stroke="#A6863D" stroke-opacity="0.7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Trend dots, lower -->
  <g fill="#FFFFFF" stroke="#C4A35A" stroke-width="3">
    <circle cx="470" cy="640" r="6" />
    <circle cx="600" cy="600" r="6" />
    <circle cx="730" cy="620" r="6" />
    <circle cx="860" cy="560" r="7" />
  </g>
  <path d="M470 640 L 600 600 L 730 620 L 860 560" stroke="#C4A35A" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
